## @extra listenerSets[].listeners[].hostname Hostname served by the listener
## @extra listenerSets[].listeners[].tls.mode TLS mode for an HTTPS listener, `Terminate` or `Passthrough`
## @extra listenerSets[].listeners[].tls.certificateRefs[].group API group of the certificate reference, empty for core
## @extra listenerSets[].listeners[].tls.certificateRefs[].kind Kind of the certificate reference, `Secret`
## @extra listenerSets[].listeners[].tls.certificateRefs[].name Name of the Secret holding the certificate
## @extra listenerSets[].listeners[].allowedRoutes.namespaces.from Which namespaces may attach routes to this listener, `All`, `Same` or `Selector`
